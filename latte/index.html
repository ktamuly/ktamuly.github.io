<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--glass:rgba(18,13,10,.66);--line:rgba(255,244,230,.09);--ink:#f2eadf;--mute:rgba(242,234,223,.55);--accent:#e9bb8b;--accent-ink:#24170e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#120d0a;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font:500 15px/1.4 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.32)}
button{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;border-radius:999px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,color .15s,opacity .15s}
button:hover{background:rgba(255,244,230,.07)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.3;pointer-events:none}
button:active{transform:scale(.96)}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));right:calc(14px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.mark{font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1;padding:4px 2px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.mark small{display:block;white-space:nowrap;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:4px}
.pill{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));max-width:calc(100% - 16px)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.seg{display:flex;background:rgba(0,0,0,.32);border-radius:999px;padding:3px;position:relative}
.seg button{min-height:38px;padding:0 14px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--accent-ink)}
.seg button.on:hover{background:var(--ink)}
.tog.on{background:var(--accent);color:var(--accent-ink)}
.tog.on:hover{background:var(--accent)}
.swatch{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);flex:none}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));font-size:13.5px;color:var(--mute);white-space:nowrap;transition:opacity .6s;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none}
.hint b{color:var(--ink);font-weight:700}
.hint.side{transform:none;white-space:normal;text-align:left;font-size:15px}
.hint.backed{white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 24px);padding:6px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.scrim{position:fixed;inset:0}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 20px));border-radius:22px;padding:16px;animation:rise .22s ease-out}
.sheet h2{font-size:15px;margin:0 0 12px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sheet h3{font-size:12.5px;font-weight:700;color:var(--mute);margin:14px 0 8px}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.opt{display:flex;width:100%;justify-content:flex-start;text-align:left;gap:12px;padding:8px 12px;border-radius:14px;min-height:52px}
.opt.on{background:rgba(255,244,230,.09)}
.opt .swatch{width:20px;height:20px}
.opt span{display:block}
.opt em{display:block;font-style:normal;font-weight:500;font-size:13px;color:var(--mute)}
.overlay{position:fixed;inset:0;background:rgba(10,6,4,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.overlay img{max-width:min(90vw,520px);max-height:68vh;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.overlay p{margin:0;color:var(--mute);font-size:14px}
.hidden{display:none!important}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
/* jug height: mode chip + hold-to-lift button, for the thumb that is not pouring */
.jugctl{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(78px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.jugrow{display:flex;align-items:flex-end;gap:8px}
.sidev{border-radius:18px;pointer-events:none;flex:none}
#svStream{stroke-dasharray:5 3;animation:flowdash .35s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-8}}
@media (prefers-reduced-motion:reduce){#svStream{animation:none}}
/* on a phone the side view sits in the label under the cup */
body[data-jug=label] #jugMode{display:none}
body[data-jug=label] .holdbtn{width:66px;height:66px}
body[data-jug=label] .sidev{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0;width:69px;height:50px}
body[data-jug=label] .status{padding:4px 16px 4px 8px;margin-top:20px;gap:8px}
body[data-jug=label] .status>i{display:none}
body[data-jug=label] #svCap{display:none}
.chip{min-height:34px;padding:0 12px;font-size:12.5px;color:var(--mute)}
.chip.on{color:var(--ink)}
.holdbtn{width:78px;height:78px;border-radius:50%;flex-direction:column;gap:0;padding:0;touch-action:none;transition:transform .12s,background .12s,color .12s}
.holdbtn svg{width:18px;height:18px;margin-bottom:-1px}
.holdbtn span{font-size:15px;font-weight:800;line-height:1.1}
.holdbtn small{font-size:11px;font-weight:600;color:var(--mute)}
.holdbtn.on,.holdbtn.on:hover{background:var(--accent);color:var(--accent-ink);transform:scale(1.06)}
.holdbtn.on small{color:rgba(36,23,14,.7)}
/* fill ring around the cup + what the jug is doing */
.ring{position:fixed;left:0;top:0;pointer-events:none;overflow:visible}
.ring circle{fill:none;stroke-linecap:round}
.ring .trk{stroke:rgba(255,244,230,.10)}
.ring .val{stroke:var(--accent);transition:stroke .3s}
.ring .mid{fill:rgba(255,244,230,.55);stroke:none}
.status{position:fixed;left:50%;transform:translate(-50%,-50%);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .35s;display:flex;align-items:center;gap:7px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.status.low i{background:var(--ink)}
/* hover labels on bar buttons */
.bar [data-tip]{position:relative}
.bar [data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);padding:5px 10px;border-radius:9px;background:rgba(18,13,10,.94);border:1px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.bar [data-tip]:hover::after,.bar [data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
@media (hover:none){.bar [data-tip]:hover::after{opacity:0}.bar [data-tip]:active::after{opacity:1;transform:translate(-50%,0)}}
/* milk row in the bar, cup gallery */
.mbar{display:flex;gap:1px}
.mbar button{min-width:38px;padding:0 3px;border-radius:12px}
.mbar svg{width:22px;height:34px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mbar button.on{background:rgba(255,244,230,.09)}
.mbar button.on svg{transform:translateY(-3px) scale(1.12)}
#cupBtn{padding:0 6px}
#cupBtn svg{width:30px;height:30px}
.cupgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cupcard{flex-direction:column;gap:4px;padding:7px 2px 6px;border-radius:14px;min-height:0}
.cupcard svg{width:54px;height:54px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.cupcard span{font-size:11.5px;line-height:1.15;text-align:center;font-weight:700}
.cupcard.on{background:rgba(255,244,230,.09)}
.cupcard.on svg{transform:scale(1.1)}
@media (max-width:420px){.cupcard svg{width:46px;height:46px}.mbar button{min-width:36px}}
/* milk cartons, cup colours, steam, sparkles */
.cartons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ccard{flex-direction:column;border-radius:16px;padding:8px 2px 6px;gap:2px;min-height:0}
.ccard svg{width:54px;height:84px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ccard span{font-size:13px}
.ccard.on{background:rgba(255,244,230,.08)}
.ccard.on svg{transform:translateY(-5px) scale(1.07)}
.note{font-size:13px;color:var(--mute);margin:8px 2px 0;min-height:18px}
.cups{display:flex;gap:4px;flex-wrap:wrap}
.cups button{padding:0;min-width:44px}
.cups i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 1.5px rgba(255,255,255,.18)}
.cups button.on i{box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 2.5px var(--accent)}
.shelf{position:fixed;display:grid;grid-template-columns:repeat(2,70px);gap:18px 14px}
.shelf button{padding:0;min-height:0;border-radius:14px;flex-direction:column;gap:4px}
.shelf button:hover{background:transparent}
.shelf svg{width:70px;height:109px;transition:transform .3s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(3px 8px 6px rgba(0,0,0,.45))}
.shelf button:hover svg{transform:translateY(-4px)}
.shelf button.on svg{transform:translateY(-10px) rotate(-4deg)}
.shelf span{font-size:12px;font-weight:700;color:var(--mute)}
.shelf button.on span{color:var(--ink)}
.steam{position:fixed;left:0;top:0;pointer-events:none;filter:blur(4px);transition:opacity .6s;overflow:visible}
.steam path{fill:none;stroke:rgba(255,255,255,.2);stroke-width:9;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:wisp 6s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:2s}.steam path:nth-child(3){animation-delay:4s}
@keyframes wisp{0%{opacity:0;transform:translateY(24px) scale(.9,.8)}35%{opacity:1}100%{opacity:0;transform:translateY(-36px) scale(1.1,1.15)}}
.steam.off{opacity:0}
.spark{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
.spark svg{position:absolute;width:18px;height:18px;margin:-9px;opacity:0}
.spark.go svg{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.steam,.spark{display:none}}
@media (max-width:420px){.seg button{padding:0 11px}button{padding:0 9px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cShade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
  </defs>
</svg>

<div class="top">
  <div class="mark">latte<small id="milkLabel">Whole milk</small></div>
  <div class="pill glass">
    <button id="newCup" aria-label="New cup" title="New cup"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10.5h1.2a2.5 2.5 0 0 1 0 5H16.6"/><path d="M8 3.5c0 1.5 1.5 1.5 1.5 3M12 3.5c0 1.5 1.5 1.5 1.5 3"/></svg></button>
    <button id="save" aria-label="Save picture" title="Save picture"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button>
  </div>
</div>

<svg class="steam" id="steam" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 110c-10-18 12-26 2-46s8-30 4-44"/><path d="M62 112c-12-20 14-28 2-50s10-30 4-46"/><path d="M92 110c-9-16 11-24 2-42s7-26 3-40"/></svg>
<div class="spark" id="spark"></div>
<div class="shelf hidden" id="shelf"></div>
<svg class="ring" id="ring" aria-hidden="true"><circle class="trk" id="ringTrk"/><circle class="val" id="ringVal"/><circle class="mid" id="ringMid" r="3"/></svg>
<div class="status glass" id="status" style="opacity:0"><i></i><span id="statusText"></span></div>

<div class="jugctl" id="jugCtl">
  <button class="chip glass" id="jugMode" aria-label="Switch the jug between automatic and manual height">Jug · Auto</button>
  <div class="jugrow">
    <button class="holdbtn glass" id="holdBtn" aria-label="Hold to lift the jug for a high pour"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V6"/><path d="M6.5 11.5L12 6l5.5 5.5"/></svg><span>High</span><small>hold</small></button>
    <svg class="sidev glass" id="sideView" viewBox="0 0 124 96" width="124" height="96" role="img" aria-label="Side view of the jug and cup">
      <defs><clipPath id="svClip"><path d="M44 50 L49 75 Q50 81 56 81 H104 Q110 81 111 75 L116 50 Z"/></clipPath></defs>
      <g clip-path="url(#svClip)">
        <rect id="svLiq" x="40" y="70" width="80" height="14" fill="#6b3a1c"/>
        <g id="svPlume" opacity="0"><line x1="66" x2="66" y1="0" y2="11" stroke="#f6eee1" stroke-width="1.6" opacity=".75"/><ellipse cx="66" cy="12" rx="10" ry="4.5" fill="#d7b086" opacity=".8"/></g>
        <rect id="svFoam" x="40" y="70" width="80" height="3" fill="#f6eee1" opacity="0"/>
        <ellipse id="svFloat" cx="66" cy="70" rx="14" ry="2.8" fill="#fffaf2" opacity="0"/>
      </g>
      <line id="svStream" x1="66" x2="66" y1="40" y2="70" stroke="#f6eee1" stroke-width="1.6" stroke-linecap="round" opacity="0"/>
      <path d="M44 50 L49 75 Q50 81 56 81 H104 Q110 81 111 75 L116 50" fill="none" stroke="rgba(255,244,230,.7)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="svJug" transform="translate(66 40)"><g transform="rotate(65)">
        <path d="M-26 7 Q-35 7 -35 13 Q-35 19 -26 19" fill="none" stroke="#8d959b" stroke-width="2.6"/>
        <rect x="-26" y="1" width="22" height="26" rx="3" fill="#c4cacf"/>
        <path d="M-6 1 L0 0 L-4 7 Z" fill="#c4cacf"/>
        <rect x="-24" y="3" width="6" height="22" rx="2" fill="#fff" opacity=".28"/>
      </g></g>
      <text id="svCap" x="62" y="92.5" text-anchor="middle" font-size="12" font-weight="700" fill="#f2eadf" font-family="Manrope,system-ui,sans-serif">High · milk sinks</text>
    </svg>
  </div>
</div>

<div class="hint" id="hint"><b>Press and hold</b> in the cup to pour</div>

<div class="bar pill glass">
  <button id="undo" aria-label="Undo" data-tip="Undo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <span class="sep"></span>
  <button id="etch" class="tog" aria-label="Etch with a toothpick" data-tip="Toothpick"><svg class="i" viewBox="0 0 24 24"><path d="M5 19L18 6"/><path d="M18 6l1.5-1.5"/><circle cx="5" cy="19" r="1.3" fill="currentColor"/></svg></button>
  <button id="flowBtn" aria-label="Milk flow: Medium" data-tip="Flow: Medium"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 3.5h9v3.2a3.6 3.6 0 0 1-3.6 3.6H7.1a3.6 3.6 0 0 1-3.6-3.6z"/><path d="M12.5 4.2l3-1.2"/><path id="flowLine" d="M15.6 3.6c.9 4.2.4 9.6.4 17" stroke-width="3"/></svg></button>
  <span class="sep" id="mbarSep"></span>
  <div class="mbar" id="mbar" role="group" aria-label="Milk"></div>
  <span class="sep"></span>
  <button id="cupBtn" aria-label="Choose a cup" data-tip="Cups"></button>
</div>

<div class="scrim hidden" id="scrim"></div>

<div class="sheet glass hidden" id="cupSheet">
  <h2>Cups</h2>
  <h3 style="margin-top:0">Shape</h3>
  <div class="cupgrid" id="shapes"></div>
  <h3>Glaze</h3>
  <div class="cupgrid" id="cups"></div>
  <p class="note" id="cupNote"></p>
  <h3>Jug height</h3>
  <div class="seg" role="group" aria-label="Jug height control" id="jugSeg" style="display:inline-flex"><button data-m="auto">Auto</button><button data-m="manual">Manual</button></div>
</div>

<div class="overlay hidden" id="shot">
  <img id="shotImg" alt="Your latte art">
  <p>Long-press or right-click the picture to save it</p>
  <button id="shotClose" class="glass" style="padding:0 22px">Close</button>
</div>

<div id="err" class="hidden"><p>This app needs WebGL 2, which this browser doesn't offer. Try a recent Safari, Chrome or Firefox.</p></div>

<script>
{
const $ = s => document.querySelector(s);
const canvas = $('#c');
const gl = canvas.getContext('webgl2', {alpha:false, depth:false, stencil:false, antialias:false, preserveDrawingBuffer:false, powerPreference:'high-performance'});

if (!gl) { $('#err').classList.remove('hidden'); for (const s of ['.bar','.top','#hint']) $(s).classList.add('hidden'); }
else {
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');

const CUP_R = 0.48;      // liquid radius in sim uv units
const SIM = 192;         // velocity / pressure grid
const DYE = 1024;        // dye texture: x foam, y crema mottling, z sheet mark, w milk mixed in below
const PRESSURE_ITERS = 30;
const JET = 0.35;        // forward push of a low pour, uv/s
const START_FILL = 0.3;  // the espresso alone
const FILL_Q = 0.042;    // milk volume per second at medium flow; the level rises slower as the cup widens toward the rim
const TUNE = {cutK:0.27, cutR:0.034, cutS:0.5, punch:0.2, punchW:0.012, highSrc:0};   // the finishing cut: how hard a high stream drags foam, and how fine a line it scores
const DROP_AT = 0.5;     // the jug comes down once the cup is half full

// ---------- milks ----------
const MILKS = {
  whole:  {name:'Whole',  note:'Silky, stable foam. Easiest for crisp art.', foam:[.985,.955,.90], swatch:'#f6eee1', sharpen:2.5, spread:1.0,  visc:1.8, fade:0,     grain:.03},

// ---------- input ----------

function handleInput(dt){

  const mw = Math.max(smooth(0.45, 0.85, h), 1 - gate); // how much the stream dives and mixes (high)

  const wasFull = fill >= 1;

function render(){

// ---------- loop ----------
let last = performance.now();
function frame(now){

}

// jug height. Automatic: high while the cup fills, low once it is half full, lifted for the finishing cut.
// Manual: low unless High is held. Holding High lifts the jug in either mode.
function autoHeight(){
  if (holdHigh) return 1;
  if (manual) return 0;

}
function updateHeight(dt){

  $('#holdBtn').classList.toggle('on', holdHigh || (ptr.active && height > 0.6));
  { // side view: where the jug is, and whether the milk sinks or floats

    const deep = fill < 0.42, sinks = height > 0.45 || deep;
    if (pouring && !sinks && ptr.t > 0.3) hasFoam = true;
    $('#svLiq').setAttribute('y', sy.toFixed(1)); $('#svLiq').setAttribute('height', (84 - sy).toFixed(1));
    $('#svFoam').setAttribute('y', (sy - 0.5).toFixed(1)); $('#svFoam').setAttribute('opacity', hasFoam ? 0.95 : 0);
    $('#svJug').setAttribute('transform', `translate(66 ${ty.toFixed(1)})`);
    const st = $('#svStream'); st.setAttribute('y1', ty.toFixed(1)); st.setAttribute('y2', sy.toFixed(1));
    st.setAttribute('stroke-width', sinks ? 1.6 : 3.6); st.setAttribute('opacity', pouring ? 1 : 0);
    $('#svPlume').setAttribute('transform', `translate(0 ${sy.toFixed(1)})`); $('#svPlume').setAttribute('opacity', pouring && sinks ? 1 : 0);
    $('#svFloat').setAttribute('cy', sy.toFixed(1)); $('#svFloat').setAttribute('opacity', pouring && !sinks ? 1 : 0);
    const cap = height > 0.45 ? 'High · milk sinks' : deep ? 'Low · still sinks' : 'Low · milk floats';
    if ($('#svCap').textContent !== cap) $('#svCap').textContent = cap;

function cupSVG(sh, c, id){
