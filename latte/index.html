<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120d0a">
<title>Latte Art Pour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--glass:rgba(18,13,10,.66);--line:rgba(255,244,230,.09);--ink:#f2eadf;--mute:rgba(242,234,223,.55);--accent:#e9bb8b;--accent-ink:#24170e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#120d0a;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font:500 15px/1.4 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#c{touch-action:none}
#guide{pointer-events:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.32)}
button{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;border-radius:999px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,color .15s,opacity .15s}
button:hover{background:rgba(255,244,230,.07)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.3;pointer-events:none}
button:active{transform:scale(.96)}
svg.i{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(14px + env(safe-area-inset-left));right:calc(14px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.mark{font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1;padding:4px 2px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.mark small{display:block;white-space:nowrap;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:0;margin-top:4px}
.pill{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));max-width:calc(100% - 16px)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.seg{display:flex;background:rgba(0,0,0,.32);border-radius:999px;padding:3px;position:relative}
.seg button{min-height:38px;padding:0 14px;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--accent-ink)}
.seg button.on:hover{background:var(--ink)}
.tog.on{background:var(--accent);color:var(--accent-ink)}
.tog.on:hover{background:var(--accent)}
.swatch{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);flex:none}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));font-size:13.5px;color:var(--mute);white-space:nowrap;transition:opacity .6s;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none}
.hint b{color:var(--ink);font-weight:700}
.hint.side{transform:none;white-space:normal;text-align:left;font-size:15px}
.hint.backed{white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 24px);padding:6px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink)}
.scrim{position:fixed;inset:0}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 20px));border-radius:22px;padding:16px;animation:rise .22s ease-out}
.sheet h2{font-size:15px;margin:0 0 12px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sheet h3{font-size:12.5px;font-weight:700;color:var(--mute);margin:14px 0 8px}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.opt{display:flex;width:100%;justify-content:flex-start;text-align:left;gap:12px;padding:8px 12px;border-radius:14px;min-height:52px}
.opt.on{background:rgba(255,244,230,.09)}
.opt .swatch{width:20px;height:20px}
.opt span{display:block}
.opt em{display:block;font-style:normal;font-weight:500;font-size:13px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{flex-direction:column;border-radius:16px;padding:10px 4px 9px;min-height:0;gap:6px;background:rgba(255,244,230,.05)}
.card svg{width:52px;height:52px}
.card span{font-size:13.5px}
.card em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--mute);margin-top:-4px}
.coach{position:fixed;left:50%;transform:translateX(-50%);top:calc(66px + env(safe-area-inset-top));width:min(400px,calc(100% - 20px));border-radius:20px;padding:12px 14px 12px}
.coach-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);font-weight:700}
.coach-text{font-size:16px;font-weight:700;margin:4px 0 10px;min-height:22px;text-wrap:balance}
.prog{height:3px;border-radius:3px;background:rgba(255,244,230,.12);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.coach-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.coach-actions:empty{display:none}
.coach-actions button{background:rgba(255,244,230,.08);font-size:14px;min-height:38px;padding:0 14px}
.coach-actions button.primary{background:var(--accent);color:var(--accent-ink)}
.jug{position:fixed;left:0;top:0;width:140px;height:180px;pointer-events:none;transform-origin:70px 14px;transition:opacity .3s,filter .3s;will-change:transform;filter:drop-shadow(4px 10px 8px rgba(0,0,0,.45))}
.jug.high{filter:drop-shadow(14px 30px 16px rgba(0,0,0,.32))}
.jug.ghost{opacity:.42;filter:none}
.overlay{position:fixed;inset:0;background:rgba(10,6,4,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.overlay img{max-width:min(90vw,520px);max-height:68vh;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.overlay p{margin:0;color:var(--mute);font-size:14px}
.hidden{display:none!important}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
/* fill ring around the cup + what the jug is doing */
.ring{position:fixed;left:0;top:0;pointer-events:none;overflow:visible}
.ring circle{fill:none;stroke-linecap:round}
.ring .trk{stroke:rgba(255,244,230,.10)}
.ring .val{stroke:var(--accent);transition:stroke .3s}
.ring .mid{fill:rgba(255,244,230,.55);stroke:none}
.status{position:fixed;left:50%;transform:translate(-50%,-50%);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .35s;display:flex;align-items:center;gap:7px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.status.low i{background:var(--ink)}
/* hover labels on bar buttons */
.bar [data-tip]{position:relative}
.bar [data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);padding:5px 10px;border-radius:9px;background:rgba(18,13,10,.94);border:1px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:700;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.bar [data-tip]:hover::after,.bar [data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
@media (hover:none){.bar [data-tip]:hover::after{opacity:0}.bar [data-tip]:active::after{opacity:1;transform:translate(-50%,0)}}
/* milk row in the bar, cup gallery */
.mbar{display:flex;gap:1px}
.mbar button{min-width:38px;padding:0 3px;border-radius:12px}
.mbar svg{width:22px;height:34px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.mbar button.on{background:rgba(255,244,230,.09)}
.mbar button.on svg{transform:translateY(-3px) scale(1.12)}
#cupBtn{padding:0 6px}
#cupBtn svg{width:30px;height:30px}
.cupgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cupcard{flex-direction:column;gap:4px;padding:7px 2px 6px;border-radius:14px;min-height:0}
.cupcard svg{width:54px;height:54px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.cupcard span{font-size:11.5px;line-height:1.15;text-align:center;font-weight:700}
.cupcard.on{background:rgba(255,244,230,.09)}
.cupcard.on svg{transform:scale(1.1)}
@media (max-width:420px){.cupcard svg{width:46px;height:46px}.mbar button{min-width:36px}}
/* milk cartons, cup colours, steam, sparkles */
.cartons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ccard{flex-direction:column;border-radius:16px;padding:8px 2px 6px;gap:2px;min-height:0}
.ccard svg{width:54px;height:84px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.ccard span{font-size:13px}
.ccard.on{background:rgba(255,244,230,.08)}
.ccard.on svg{transform:translateY(-5px) scale(1.07)}
.note{font-size:13px;color:var(--mute);margin:8px 2px 0;min-height:18px}
.cups{display:flex;gap:4px;flex-wrap:wrap}
.cups button{padding:0;min-width:44px}
.cups i{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 1.5px rgba(255,255,255,.18)}
.cups button.on i{box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 2.5px var(--accent)}
.shelf{position:fixed;display:grid;grid-template-columns:repeat(2,70px);gap:18px 14px}
.shelf button{padding:0;min-height:0;border-radius:14px;flex-direction:column;gap:4px}
.shelf button:hover{background:transparent}
.shelf svg{width:70px;height:109px;transition:transform .3s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(3px 8px 6px rgba(0,0,0,.45))}
.shelf button:hover svg{transform:translateY(-4px)}
.shelf button.on svg{transform:translateY(-10px) rotate(-4deg)}
.shelf span{font-size:12px;font-weight:700;color:var(--mute)}
.shelf button.on span{color:var(--ink)}
.steam{position:fixed;left:0;top:0;pointer-events:none;filter:blur(4px);transition:opacity .6s;overflow:visible}
.steam path{fill:none;stroke:rgba(255,255,255,.2);stroke-width:9;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;animation:wisp 6s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:2s}.steam path:nth-child(3){animation-delay:4s}
@keyframes wisp{0%{opacity:0;transform:translateY(24px) scale(.9,.8)}35%{opacity:1}100%{opacity:0;transform:translateY(-36px) scale(1.1,1.15)}}
.steam.off{opacity:0}
.spark{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none}
.spark svg{position:absolute;width:18px;height:18px;margin:-9px;opacity:0}
.spark.go svg{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.steam,.spark{display:none}}
@media (max-width:420px){.seg button{padding:0 11px}button{padding:0 9px}.card svg{width:44px;height:44px}}
@media (min-width:900px) and (min-aspect-ratio:5/4){.coach{left:calc(20px + env(safe-area-inset-left));transform:none;top:auto;bottom:calc(20px + env(safe-area-inset-bottom));width:340px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.hint{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="guide"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0.3"><stop offset="0" stop-color="#f6f8f9"/><stop offset=".45" stop-color="#c4cacf"/><stop offset="1" stop-color="#737c83"/></linearGradient>
    <linearGradient id="steelDark" x1="0" x2="1"><stop offset="0" stop-color="#9aa3a9"/><stop offset="1" stop-color="#5d666c"/></linearGradient>
    <linearGradient id="cShade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
    <radialGradient id="skin" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#e6bb96"/><stop offset=".7" stop-color="#bf8a63"/><stop offset="1" stop-color="#9b6845"/></radialGradient>
  </defs>
</svg>

<div class="jug hidden" id="jug" aria-hidden="true">
  <svg viewBox="-70 -14 140 180" width="140" height="180">
    <rect x="-8" y="86" width="16" height="46" rx="8" fill="url(#steelDark)"/>
    <path d="M0 0 L15 21 C36 27 45 45 45 63 C45 89 25 105 0 105 C-25 105 -45 89 -45 63 C-45 45 -36 27 -15 21 Z" fill="url(#steel)"/>
    <path d="M0 0 L15 21 C36 27 45 45 45 63 C45 89 25 105 0 105 C-25 105 -45 89 -45 63 C-45 45 -36 27 -15 21 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>
    <ellipse cx="0" cy="61" rx="35" ry="37" fill="#5f686e" opacity=".55"/>
    <ellipse id="jugMilk" cx="0" cy="60" rx="33" ry="35" fill="#f7f1e6"/>
    <path id="jugSpout" d="M0 5 L9 21 L-9 21 Z" fill="#f7f1e6"/>
    <ellipse cx="-12" cy="48" rx="12" ry="7" fill="#fff" opacity=".35"/>
    <path d="M-24 132 C-30 114 -16 101 0 101 C16 101 30 114 24 133 C20 152 -20 153 -24 132 Z" fill="url(#skin)"/>
    <path d="M18 112 C30 104 40 108 40 116 C40 123 31 125 22 124" fill="url(#skin)"/>
    <path d="M-14 120 C-6 124 6 124 14 120" stroke="rgba(90,50,25,.35)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-15 129 C-6 133 6 133 15 129" stroke="rgba(90,50,25,.3)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<div class="top">
  <div class="mark">latte<small id="milkLabel">Whole milk</small></div>
  <div class="pill glass">
    <button id="newCup" aria-label="New cup" title="New cup"><svg class="i" viewBox="0 0 24 24"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10.5h1.2a2.5 2.5 0 0 1 0 5H16.6"/><path d="M8 3.5c0 1.5 1.5 1.5 1.5 3M12 3.5c0 1.5 1.5 1.5 1.5 3"/></svg></button>
    <button id="learnBtn" aria-label="Learn a pattern"><svg class="i" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/><path d="M22 9v6"/></svg>Learn</button>
    <button id="save" aria-label="Save picture" title="Save picture"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button>
  </div>
</div>

<div class="coach glass hidden" id="coach">
  <div class="coach-top"><span id="coachName">Heart</span><span id="coachStep"></span></div>
  <div class="coach-text" id="coachText"></div>
  <div class="prog"><i id="coachProg"></i></div>
  <div class="coach-actions" id="coachActions"></div>
</div>

<svg class="steam" id="steam" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 110c-10-18 12-26 2-46s8-30 4-44"/><path d="M62 112c-12-20 14-28 2-50s10-30 4-46"/><path d="M92 110c-9-16 11-24 2-42s7-26 3-40"/></svg>
<div class="spark" id="spark"></div>
<div class="shelf hidden" id="shelf"></div>
<svg class="ring" id="ring" aria-hidden="true"><circle class="trk" id="ringTrk"/><circle class="val" id="ringVal"/><circle class="mid" id="ringMid" r="3"/></svg>
<div class="status glass" id="status" style="opacity:0"><i></i><span id="statusText"></span></div>

<div class="hint" id="hint"><b>Press and hold</b> in the cup to pour</div>

<div class="bar pill glass">
  <button id="undo" aria-label="Undo" data-tip="Undo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <span class="sep"></span>
  <button id="etch" class="tog" aria-label="Etch with a toothpick" data-tip="Toothpick"><svg class="i" viewBox="0 0 24 24"><path d="M5 19L18 6"/><path d="M18 6l1.5-1.5"/><circle cx="5" cy="19" r="1.3" fill="currentColor"/></svg></button>
  <button id="flowBtn" aria-label="Milk flow: Medium" data-tip="Flow: Medium"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 3.5h9v3.2a3.6 3.6 0 0 1-3.6 3.6H7.1a3.6 3.6 0 0 1-3.6-3.6z"/><path d="M12.5 4.2l3-1.2"/><path id="flowLine" d="M15.6 3.6c.9 4.2.4 9.6.4 17" stroke-width="3"/></svg></button>
  <span class="sep" id="mbarSep"></span>
  <div class="mbar" id="mbar" role="group" aria-label="Milk"></div>
  <span class="sep"></span>
  <button id="cupBtn" aria-label="Choose a cup" data-tip="Cups"></button>
</div>

<div class="scrim hidden" id="scrim"></div>

<div class="sheet glass hidden" id="cupSheet">
  <h2>Cups</h2>
  <h3 style="margin-top:0">Shape</h3>
  <div class="cupgrid" id="shapes"></div>
  <h3>Glaze</h3>
  <div class="cupgrid" id="cups"></div>
  <p class="note" id="cupNote"></p>
</div>

<div class="sheet glass hidden" id="learnSheet">
  <h2>Learn a pattern</h2>
  <div class="grid" id="styleGrid"></div>
</div>

<div class="overlay hidden" id="shot">
  <img id="shotImg" alt="Your latte art">
  <p>Long-press or right-click the picture to save it</p>
  <button id="shotClose" class="glass" style="padding:0 22px">Close</button>
</div>

<div id="err" class="hidden"><p>This app needs WebGL 2, which this browser doesn't offer. Try a recent Safari, Chrome or Firefox.</p></div>

<script>
{
const $ = s => document.querySelector(s);
const canvas = $('#c');
const gl = canvas.getContext('webgl2', {alpha:false, depth:false, stencil:false, antialias:false, preserveDrawingBuffer:false, powerPreference:'high-performance'});

if (!gl) { $('#err').classList.remove('hidden'); for (const s of ['.bar','.top','#hint']) $(s).classList.add('hidden'); }
else {
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');

const CUP_R = 0.48;      // liquid radius in sim uv units
const SIM = 192;         // velocity / pressure grid
const DYE = 1024;        // dye texture: x foam, y crema mottling, z pass id, w milk mixed in below
const PRESSURE_ITERS = 30;
const JET = 0.35;        // forward push of a low pour, uv/s
const START_FILL = 0.3;  // the espresso alone
const FILL_RATE = 0.095; // cup fraction per second at medium flow
const DROP_AT = 0.5;     // the jug comes down once the cup is half full

// ---------- milks ----------
const MILKS = {
  whole:  {name:'Whole',  note:'Silky, stable foam. Easiest for crisp art.', foam:[.985,.955,.90], swatch:'#f6eee1', sharpen:2.5, spread:1.0,  visc:1.8, fade:0,     grain:.03},
  oat:    {name:'Oat',    note:'Creamy and warm. Spreads a little faster.',  foam:[.975,.93,.85],  swatch:'#eedfc6', sharpen:2.2, spread:1.2,  visc:1.5, fade:0,     grain:.03},
  almond: {name:'Almond', note:'Thin foam. Softer edges that fade sooner.',  foam:[.96,.915,.845], swatch:'#e6d6bd', sharpen:1.1, spread:1.15, visc:1.35,fade:.035,  grain:.06},
  skim:   {name:'Skim',   note:'Stiff, airy foam. Spreads slowly, bubbly.',  foam:[.99,.985,.975], swatch:'#fbfaf7', sharpen:3.2, spread:.7,   visc:2.6, fade:.008,  grain:.065}
};
let milkKey = 'whole', milk = MILKS.whole;

// ---------- shaders ----------
const VS = `#version 300 es
precision highp float;
in vec2 aPos;
uniform vec2 texelSize;
out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
void main(){
  vUv = aPos*0.5+0.5;
  vL = vUv - vec2(texelSize.x,0.); vR = vUv + vec2(texelSize.x,0.);
  vT = vUv + vec2(0.,texelSize.y); vB = vUv - vec2(0.,texelSize.y);
  gl_Position = vec4(aPos,0.,1.);
}`;

const H = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB;
out vec4 fragColor;
uniform float uCupR;
float cupMask(vec2 uv){ return step(length(uv-0.5), uCupR); }
`;

const NOISE = `
uniform float uSeed;

function toUv(cx, cy){ const k = simScale*surfR; return [0.5 + (cx*dpr - center[0])/k, 0.5 + ((Hh - cy*dpr) - center[1])/k]; }

canvas.addEventListener('pointerdown', e => {

function splatVel(a, b, f, r, s){
  const u = P.splatVel.use();
  gl.uniform1i(u.uTarget, vel.read.attach(0)); gl.uniform1f(u.uCupR, CUP_R);
  gl.uniform2f(u.uA, a[0], a[1]); gl.uniform2f(u.uB, b[0], b[1]);

  gl.uniform2f(u.uA, a[0], a[1]); gl.uniform2f(u.uB, b[0], b[1]);
  gl.uniform1f(u.uRadius, r); gl.uniform1f(u.uAmount, amt); gl.uniform1f(u.uPass, passId); gl.uniform1f(u.uMode, modeId);

function handleInput(dt){
  source[2] = 0; stream[3] = 0;
  if (!ptr.active) return;
  ptr.t += dt;
  const cur = clampUv(toUv(ptr.cx, ptr.cy));
  const prev = ptr.last || cur; ptr.last = cur;
  const dx = cur[0]-prev[0], dy = cur[1]-prev[1], dist = Math.hypot(dx,dy);
  ptr.vel[0] += (dx/dt - ptr.vel[0])*0.5; ptr.vel[1] += (dy/dt - ptr.vel[1])*0.5;
  const speed = Math.hypot(ptr.vel[0], ptr.vel[1]);
  const k = 1 - Math.exp(-dt/0.10);   // slow average: a wiggle averages out, a straight cut does not
  ptr.drift[0] += (dx/dt - ptr.drift[0])*k; ptr.drift[1] += (dy/dt - ptr.drift[1])*k;
  const dspeed = Math.hypot(ptr.drift[0], ptr.drift[1]);
  const gx = center[0] + (cur[0]-0.5)*simScale*surfR, gy = center[1] + (cur[1]-0.5)*simScale*surfR;
  if (mode === 'etch'){
    splatVel(prev, cur, ptr.vel, 0.011, 0.9);
    stream = [gx, gy, 3.5*dpr, -1];
    return;
  }
  const ramp = Math.min(1, ptr.t/0.25);
  const press = ptr.type === 'pen' ? 0.3 + 1.4*ptr.pressure : 1;
  const flow = flows[flowIdx].v*ramp*press*(fill >= 1 ? 0 : 1);
  const wasFull = fill >= 1;
  fill = Math.min(1, fill + FILL_RATE*flow*dt);
  if (!wasFull && fill >= 1) served();

  const gate = smooth(0.36, 0.48, fill);  // below this the surface is too deep: milk sinks whatever the jug height
  const fw = (1 - smooth(0.25, 0.65, h))*gate;          // how much foam surfaces (low)
  const mw = Math.max(smooth(0.45, 0.85, h), 1 - gate); // how much the stream dives and mixes (high)
  let src = 0;
  if (mw > 0.01){
    splatMilk(prev, cur, 0.085, 14*dt*flow*mw, 1);
    src += 6*flow*mw;
  }
  const thin = 1/(1 + speed*1.6);
  const rad = (0.014 + 0.012*Math.min(flow,1.7))*(0.55 + 0.45*thin)*(1 - 0.4*smooth(0.15, 0.6, h));

  splatVel(prev, cur, [ptr.drift[0]*0.4, ptr.drift[1]*0.4], rad*2.0, 0.5*Math.min(1, dspeed*2.5)*(1 - 0.6*mw));

}

// ---------- simulation ----------
function stepSim(dt){
  let u = P.divergence.use();
  gl.uniform2f(u.texelSize, vel.texel[0], vel.texel[1]); gl.uniform1f(u.uCupR, CUP_R);
  gl.uniform1i(u.uVelocity, vel.read.attach(0));

  blit(pressure.write); pressure.swap();

  u = P.pressure.use();
  gl.uniform2f(u.texelSize, vel.texel[0], vel.texel[1]); gl.uniform1f(u.uCupR, CUP_R);
  gl.uniform1i(u.uDivergence, divergence.attach(0));

  u = P.gradSub.use();
  gl.uniform2f(u.texelSize, vel.texel[0], vel.texel[1]); gl.uniform1f(u.uCupR, CUP_R);
  gl.uniform1i(u.uPressure, pressure.read.attach(0)); gl.uniform1i(u.uVelocity, vel.read.attach(1));

  u = P.advect.use();
  gl.uniform1f(u.uCupR, CUP_R); gl.uniform1f(u.uDt, dt);
  gl.uniform1i(u.uVelocity, vel.read.attach(0)); gl.uniform1i(u.uSource, vel.read.attach(0));
  gl.uniform1f(u.uDissipation, milk.visc); gl.uniform1f(u.uIsVel, 1); gl.uniform1f(u.uSharpen, 0); gl.uniform1f(u.uFade, 0);
  blit(vel.write); vel.swap();

  gl.uniform1i(u.uVelocity, vel.read.attach(0)); gl.uniform1i(u.uSource, dye.read.attach(1));
  gl.uniform1f(u.uDissipation, 0); gl.uniform1f(u.uIsVel, 0); gl.uniform1f(u.uSharpen, milk.sharpen); gl.uniform1f(u.uFade, milk.fade);

  gl.uniform2f(u.uCenter, center[0], center[1]); gl.uniform1f(u.uLiqR, liqR); gl.uniform1f(u.uSimScale, simScale); gl.uniform1f(u.uSurf, surfR); gl.uniform3f(u.uCupCol, cupColor[0], cupColor[1], cupColor[2]);

function lessonAt(st, t){
  let acc = 0;
  for (let i=0;i<st.steps.length;i++){ const s = st.steps[i]; if (t < acc+s.d) return {i, s, k:(t-acc)/s.d, end:false}; acc += s.d; }

}

function drawGuide(st, t){

  g2.save(); g2.scale(dpr,dpr);
  g2.setLineDash([5,7]); g2.lineWidth = 2; g2.lineCap = 'round';
  let acc = 0;

function updateLesson(dt){
  if (!lesson) return;
  const L = lesson, st = L.st;
  if (L.started && !L.done) L.t += dt;
  const ls = lessonAt(st, L.t);
  const [u,v] = ls.s.p(ls.k);
  lessonH = (L.kind === 'watch' && !L.done) ? ls.s.h : null;
  const n = st.steps.length;
  if (L.kind === 'watch'){
    if (!ls.end && ls.s.down){
      const [x,y] = uvToClient(u,v);
      if (!ptr.active) beginStroke(x, y, 'demo', 'demo', 0.5);
      ptr.cx = x; ptr.cy = y;
    } else if (ptr.active && ptr.id === 'demo') ptr.active = false;
    placeJug(u, v, false, height, !ls.end);
    if (ls.end){
      if (!L.done){ L.done = true; ptr.active = false; }
      setCoach(st.name, 'Your turn', 'Follow the ghost jug and its dotted path.', 1,
        [['Try it', () => startLesson(L.key,'try'), true], ['Watch again', () => startLesson(L.key,'watch')], ['Close', endLesson]]);
    } else {
      setCoach(st.name, `Step ${ls.i+1} of ${n}`, ls.s.t, L.t/st.total, [['Skip', () => startLesson(L.key,'try')], ['Close', endLesson]]);
    }
  } else {
    if (!L.started){
      placeJug(...st.steps[0].p(0), true, st.steps[0].h, true);
      setCoach(st.name, 'Your turn', 'Press and hold under the ghost jug to start.', 0, [['Watch', () => startLesson(L.key,'watch')], ['Close', endLesson]]);
    } else if (ls.end){
      if (!L.done){ L.done = true; }
      jug.classList.add('hidden');
      setCoach(st.name, 'Done', 'Nice pour. Go again, or watch it once more.', 1,
        [['Again', () => startLesson(L.key,'try'), true], ['Watch', () => startLesson(L.key,'watch')], ['Close', endLesson]]);
    } else {
      placeJug(u, v, true, ls.s.h, true);
      setCoach(st.name, `Step ${ls.i+1} of ${n}`, (ls.s.down ? '' : '') + ls.s.t, L.t/st.total, [['Restart', () => startLesson(L.key,'try')], ['Close', endLesson]]);
    }
  }
  drawGuide(st, L.t);
}

function flashNote(t){ const h = $('#hint'); h.textContent = t; h.style.opacity = 1; clearTimeout(noteT); noteT = setTimeout(() => h.style.opacity = 0, 2200); }
$('#styleGrid').innerHTML = Object.entries(STYLES).map(([k,s]) =>
  `<button class="card" data-k="${k}"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#5a3218"/><circle cx="24" cy="24" r="22" fill="none" stroke="#efe8de" stroke-width="2.4"/>${ICONS[k]}</svg><span>${s.name}</span><em>${s.level}</em></button>`).join('');
for (const b of document.querySelectorAll('#styleGrid .card')) b.onclick = () => startLesson(b.dataset.k, 'watch');

function closeSheets(){ for (const s of ['#cupSheet','#learnSheet','#scrim']) $(s).classList.add('hidden'); }
function openSheet(id){ $('#hint').style.opacity = 0; const was = !$(id).classList.contains('hidden'); closeSheets(); if (!was){ $(id).classList.remove('hidden'); $('#scrim').classList.remove('hidden'); } }
$('#scrim').onclick = closeSheets;
$('#cupBtn').onclick = () => openSheet('#cupSheet');
$('#learnBtn').onclick = () => openSheet('#learnSheet');
$('#etch').onclick = () => setMode(mode === 'etch' ? 'pour' : 'etch');
$('#newCup').onclick = () => { if (lesson) endLesson(); newCup(); };
$('#undo').onclick = undo;
$('#save').onclick = () => {
  stream[3] = 0; render();
  const size = Math.round(liqR*3.4);
  const sx = Math.max(0, Math.round(center[0]-size/2)), sy = Math.max(0, Math.round((Hh-center[1])-size/2));
  const sw = Math.min(size, W-sx), sh = Math.min(size, Hh-sy);
  const off = document.createElement('canvas'); off.width = sw; off.height = sh;
  off.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
  $('#shotImg').src = off.toDataURL('image/png');
  $('#shot').classList.remove('hidden');
};
$('#shotClose').onclick = () => $('#shot').classList.add('hidden');
window.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); return; }
  const k = e.key.toLowerCase();
  if (k === 'shift') holdHigh = true;
  else if (k === 'e') setMode(mode === 'etch' ? 'pour' : 'etch');
  else if (k === 'escape'){ closeSheets(); if (lesson) endLesson(); }
});

window.addEventListener('keyup', e => { if (e.key === 'Shift') holdHigh = false; });
window.addEventListener('blur', () => { holdHigh = false; });
canvas.addEventListener('webglcontextlost', e => e.preventDefault());
canvas.addEventListener('webglcontextrestored', () => location.reload());

let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); });
setMilk('whole'); setFlow(1);
{ let gi = 1, si = 0;   // speckled classic by default
  try { const g = localStorage.getItem('latte-glaze'), sp = localStorage.getItem('latte-shape'); if (g !== null) gi = +g; if (sp !== null) si = +sp; } catch(_) {}
  cup = CUPS[gi] || CUPS[1]; shape = SHAPES[si] || SHAPES[0]; cupColor = cup.inn; drawCupGrids(); }
layout(); newCup();
requestAnimationFrame(frame);
}
}
</script>
</body>
