<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing by Kaustav Tamuly</title>
<meta name="description" content="Writing by Kaustav Tamuly.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --rule: #dedede; --link: #5a4208; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.6 "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
main { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding-block: 48px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.field { position: fixed; left: 0; bottom: 0; z-index: 0; width: 100%; height: 260px; image-rendering: pixelated; pointer-events: none; opacity: 0.6; }
h1 { font-size: 1.35em; line-height: 1.25; margin: 0 0 0.3em; font-weight: 600; text-wrap: balance; }
nav { margin: 0 0 1.8em; color: var(--muted); }
.site { margin: 0 0 0.2em; font-weight: 600; }
.site a { color: var(--fg); text-decoration: none; }
nav a, nav span { margin-right: 1.1em; }
nav span { color: var(--fg); font-weight: 600; }
p { margin: 1.6em 0 0.4em; }
ul, ol { margin: 0.3em 0; padding-left: 1.5em; }
li { margin: 0.25em 0; }
a { color: var(--link); text-underline-offset: 0.18em; }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.when { color: var(--muted); }
/* article */
.post h1 { font-size: 1.5em; margin-bottom: 0.4em; }
.post .dek { margin: 0 0 0.5em; font-style: italic; }
.post .date { color: var(--muted); margin: 0 0 2em; }
.post h2 { font-size: 1.2em; line-height: 1.3; margin: 2.4em 0 0.6em; padding-top: 1.4em; border-top: 1px solid var(--rule); }
.post h3 { font-size: 1.05em; line-height: 1.35; margin: 2em 0 0.5em; }
.post h4 { font-size: 1em; margin: 1.6em 0 0.4em; color: var(--muted); }
.post p { margin: 0.9em 0; }
.post li { margin: 0.45em 0; }
.post code { background: #f3f1ea; padding: 0.05em 0.3em; border-radius: 3px; overflow-wrap: anywhere; }
.post ~ .field { opacity: 0.22; height: 170px; }
figure { margin: 1.6em 0 1.8em; }
figure svg { display: block; width: 100%; height: auto; font-family: inherit; }
figcaption { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 0.7em; }
.post .figtitle { font-weight: 600; margin: 0 0 0.9em; text-wrap: balance; }
figure { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 1.2em 0; }
.scroll { overflow-x: auto; margin: 1.1em 0; }
table { border-collapse: collapse; font-size: 12.5px; line-height: 1.4; }
th, td { text-align: left; vertical-align: top; padding: 0.35em 1em 0.35em 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); border-bottom-color: #9a9a9a; white-space: normal; min-width: 5em; vertical-align: bottom; }
td.long { white-space: normal; min-width: 18em; }
.post .math { text-align: center; margin: 1.4em 0; overflow-x: auto; white-space: nowrap;
  font: 1.25em/1.6 "STIX Two Text", "Cambria Math", Cambria, "Times New Roman", serif; }
.post .math sub { font-size: 0.7em; }
</style>
</head>
<body>
<main>
<h1>Kaustav Tamuly</h1>
<nav aria-label="Site"><a href="../">About</a><span>Writing</span><a href="../projects/">Projects</a></nav>
<ul>
<li><a href="inkling-2-mini/">I tested Goodfire's idea about Inkling 2 Mini's loop</a> <span class="when">(November 2026)</span></li>
<li><a href="ntk-alignment/">The Neural Tangent Kernel of Alignment</a> <span class="when">(December 2025)</span></li>
</ul>
</main>
<canvas id="field" class="field" aria-hidden="true"></canvas>
<script>
// A soft pixel wheat field that sways in the wind. Drawn at half resolution and scaled up without smoothing.
(function () {
  var c = document.getElementById("field");
  if (!c || !c.getContext) return;
  var ctx = c.getContext("2d"), S = 2, H = 130, MAXW = 2000, W = 0, img, d;
  var seed = 20261123;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  // far to near: density per pixel of width, height range, colours (stem, ear, ear edge, awn), how much it moves
  var LAYERS = [
    { n: 0.50, h: [44, 74],  stem: [240, 231, 201], ear: [236, 224, 186], edge: [231, 216, 171], awn: [243, 236, 213], sway: 0.75 },
    { n: 0.42, h: [54, 94],  stem: [232, 217, 166], ear: [226, 206, 145], edge: [218, 195, 126], awn: [237, 224, 181], sway: 0.9 },
    { n: 0.34, h: [62, 112], stem: [221, 199, 134], ear: [214, 187, 110], edge: [203, 173, 93],  awn: [230, 212, 154], sway: 1.0 }
  ];
  var stalks = [];
  LAYERS.forEach(function (L) {
    for (var i = 0, n = Math.round(L.n * MAXW); i < n; i++) {
      stalks.push({
        L: L, x: rnd() * MAXW, h: L.h[0] + rnd() * (L.h[1] - L.h[0]), stiff: 0.65 + rnd() * 0.7, lag: rnd() * 0.9,
        ear: 7 + Math.floor(rnd() * 6), droop: 0.15 + rnd() * 0.35,
        leaf: rnd() < 0.4 ? { at: 0.25 + rnd() * 0.35, len: 5 + Math.floor(rnd() * 6), dir: rnd() < 0.5 ? -1 : 1 } : null
      });
    }
  });
  var GRASS = { stem: [228, 211, 156], sway: 0.6 }, blades = [];
  for (var g = 0; g < MAXW * 1.1; g++) blades.push({ x: rnd() * MAXW, h: 5 + rnd() * rnd() * 26, stiff: 0.6 + rnd() * 0.8, lag: rnd() });

  function px(x, y, col) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || x >= W || y < 0 || y >= H) return;
    var i = (y * W + x) * 4;
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  // Tip displacement as a fraction of height: a steady lean plus gusts that travel across the field.
  function wind(x, t) {
    return 0.08 + 0.13 * Math.sin(x * 0.011 - t * 0.8) + 0.06 * Math.sin(x * 0.029 - t * 1.5 + 1.3) + 0.05 * Math.sin(x * 0.0037 - t * 0.3);
  }
  function draw(t) {
    for (var z = 0; z < d.length; z += 4) d[z + 3] = 0;
    for (var n = 0; n < stalks.length; n++) {
      var s = stalks[n];
      if (s.x > W + 30) continue;
      var L = s.L, w = wind(s.x, t - s.lag) * s.stiff * L.sway, tip = w * s.h, k, f;
      for (k = 0; k < s.h; k++) { f = k / s.h; px(s.x + tip * f * f, H - 1 - k, L.stem); }   // the stem bends more toward the top
      if (s.leaf) {
        f = s.leaf.at;
        var lx = s.x + tip * f * f, ly = H - 1 - f * s.h, m = s.leaf.len;
        for (k = 1; k <= m; k++) px(lx + s.leaf.dir * k + w * k * 0.5, ly - Math.sin(k / m * 2.4) * m * 0.45, L.stem);
      }
      var x0 = s.x + tip, y0 = H - 1 - s.h, slope = 2 * w + (w >= 0 ? s.droop : -s.droop);       // the ear hangs over, downwind
      for (k = 0; k < s.ear; k++) {
        var ex = x0 + slope * k * (1 + k * 0.05), ey = y0 - k + Math.abs(slope) * k * k * 0.035, side = k % 2 ? 1 : -1;
        px(ex, ey, L.ear);
        if (k > 0 && k < s.ear - 1) { px(ex + side, ey, L.edge); if (k > 1 && k < s.ear - 2) px(ex - side, ey, L.ear); }
        if (k % 2 && k < s.ear - 1) { var sd = (k >> 1) % 2 ? 1 : -1; for (var j = 1; j < 4; j++) px(ex + sd * (1 + j) + slope * j, ey - j, L.awn); }
      }
    }
    for (var b = 0; b < blades.length; b++) {
      var bl = blades[b];
      if (bl.x > W + 10) continue;
      var bw = wind(bl.x, t - bl.lag) * bl.stiff * GRASS.sway * 1.6 * bl.h;
      for (var q = 0; q < bl.h; q++) { var ff = q / bl.h; px(bl.x + bw * ff * ff, H - 1 - q, GRASS.stem); }
    }
    ctx.putImageData(img, 0, 0);
  }
  function size() {
    W = Math.min(MAXW, Math.ceil(c.clientWidth / S));
    c.width = W; c.height = H;
    img = ctx.createImageData(W, H); d = img.data;
  }
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, last = -1e9;
  function frame(ts) {
    if (Math.min(MAXW, Math.ceil(c.clientWidth / S)) !== W) size();
    if (W > 0 && ts - last > 80) { last = ts; draw(ts / 1000); }                                           // about 12 frames a second
    requestAnimationFrame(frame);
  }
  size();
  window.addEventListener("resize", function () { size(); draw(performance.now() / 1000); });
  if (still) { if (W > 0) draw(0); } else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
